<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOM · Overlay Live</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ==========================================
           BACKGROUND BINTANG (opsional, bisa diaktifkan)
           ========================================== */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.3;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--duration) infinite alternate;
            opacity: 0.5;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ==========================================
           OVERLAY UTAMA — TRANSPARAN
           ========================================== */
        .overlay {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        /* ==========================================
           HEADER — ATAS
           ========================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 10px;
        }

        /* NAMA STREAMER — MERAH PUTIH HITAM BERGERAK */
        .streamer-name {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff1a1a, #ffffff, #1a1a1a, #ff1a1a, #ffffff, #1a1a1a);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: merahPutihHitam 3.2s linear infinite;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            pointer-events: none;
            user-select: none;
        }
        @keyframes merahPutihHitam {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        /* INFO VIEWERS — KOTAK TRANSPARAN */
        .viewers-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            pointer-events: none;
            user-select: none;
        }
        .viewers-box .icon {
            font-size: 20px;
        }
        #viewerCount {
            color: #ff4d4d;
            min-width: 30px;
            text-align: center;
        }

        /* ==========================================
           CHAT — KIRI BAWAH (opsional)
           ========================================== */
        .chat-area {
            position: absolute;
            bottom: 40px;
            left: 30px;
            max-width: 380px;
            max-height: 250px;
            overflow: hidden;
            pointer-events: none;
        }

        .chat-message {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px 14px;
            margin-bottom: 6px;
            font-size: 14px;
            color: #eee;
            animation: slideIn 0.4s ease-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-message .user {
            font-weight: 700;
            color: #ff6b6b;
        }
        .chat-message .text {
            color: #ddd;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ==========================================
           GOAL / DONASI — KANAN BAWAH
           ========================================== */
        .goal-area {
            position: absolute;
            bottom: 40px;
            right: 30px;
            pointer-events: none;
        }

        .goal-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 20px;
            min-width: 180px;
            text-align: center;
        }
        .goal-box .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .goal-box .amount {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff1a1a, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .goal-box .target {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .goal-box .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .goal-box .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1a1a, #ffffff);
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* ==========================================
           NOTIF / ALERT — TENGAH
           ========================================== */
        .alert-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
        }

        .alert {
            font-size: 60px;
            font-weight: 900;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.5);
            pointer-events: none;
            user-select: none;
        }
        .alert.show {
            opacity: 1;
            transform: scale(1);
        }
        .alert .sub {
            font-size: 24px;
            font-weight: 400;
            color: #aaa;
            display: block;
            margin-top: 10px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 768px) {
            .streamer-name { font-size: 28px; }
            .viewers-box { font-size: 14px; padding: 6px 12px; }
            .chat-area { max-width: 240px; bottom: 20px; left: 16px; }
            .chat-message { font-size: 12px; padding: 6px 10px; }
            .goal-area { bottom: 20px; right: 16px; }
            .goal-box { padding: 10px 14px; min-width: 120px; }
            .goal-box .amount { font-size: 20px; }
            .alert { font-size: 40px; }
            .alert .sub { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- BINTANG (opsional) -->
    <div id="stars"></div>

    <!-- OVERLAY -->
    <div class="overlay">

        <!-- HEADER ATAS -->
        <div class="header">
            <div class="streamer-name">𝗧𝗛𝗢𝗠</div>
            <div class="viewers-box">
                <span class="icon">👁️</span>
                <span id="viewerCount">0</span>
            </div>
        </div>

        <!-- CHAT (kiri bawah) -->
        <div class="chat-area" id="chatArea">
            <!-- Chat akan muncul di sini via JS -->
        </div>

        <!-- GOAL (kanan bawah) -->
        <div class="goal-area">
            <div class="goal-box">
                <div class="label">🎯 Donasi</div>
                <div class="amount" id="donationAmount">Rp 0</div>
                <div class="target">Target: Rp 1.000.000</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- ALERT (tengah) -->
        <div class="alert-area" id="alertArea">
            <div class="alert" id="alert">
                🎉
                <span class="sub" id="alertSub">Terima kasih!</span>
            </div>
        </div>

    </div>

    <script>
        // =============================================
        // 1. BINTANG (opsional)
        // =============================================
        (function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                const size = 1 + Math.random() * 2.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                container.appendChild(star);
            }
        })();

        // =============================================
        // 2. SIMULASI VIEWER (random)
        // =============================================
        let viewers = Math.floor(Math.random() * 50) + 10;
        document.getElementById('viewerCount').textContent = viewers;

        setInterval(() => {
            const change = Math.floor(Math.random() * 5) - 2;
            viewers = Math.max(0, viewers + change);
            document.getElementById('viewerCount').textContent = viewers;
        }, 5000);

        // =============================================
        // 3. SIMULASI CHAT (dari daftar nama)
        // =============================================
        const names = ['🪐', '★', '✦', '💫', '🔥', '⚡', '🎮', '👾', '🤖', '👽'];
        const messages = [
            'Halo THOM!', 'Mantap live nya!', 'Hadehh', 'Gaskeun!',
            'Jangan lupa subscribe', 'Gokil abis!', 'Cantik banget!',
            'Mabar yuk!', 'Thumbs up!', 'Love from me!',
            'Jago banget!', 'Lucu deh!', 'Aku nonton!'
        ];

        function addChat() {
            const area = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = 'chat-message';
            const user = names[Math.floor(Math.random() * names.length)];
            const text = messages[Math.floor(Math.random() * messages.length)];
            msg.innerHTML = `<span class="user">${user}</span><span class="text">${text}</span>`;
            area.appendChild(msg);

            // Batasi chat maksimal 5
            while (area.children.length > 5) {
                area.removeChild(area.firstChild);
            }
        }

        // Chat muncul tiap 3-6 detik
        setInterval(addChat, 3000 + Math.random() * 3000);

        // Tambahkan chat awal
        setTimeout(addChat, 500);
        setTimeout(addChat, 1500);

        // =============================================
        // 4. SIMULASI DONASI (goal)
        // =============================================
        let donation = 0;
        const target = 1000000;

        function updateDonation() {
            const add = Math.floor(Math.random() * 50000) + 10000;
            donation = Math.min(donation + add, target);
            document.getElementById('donationAmount').textContent = 'Rp ' + donation.toLocaleString('id-ID');
            document.getElementById('progressFill').style.width = (donation / target * 100) + '%';

            // Alert kalau ada donasi
            if (add > 30000) {
                showAlert('💖', 'Donasi Rp ' + add.toLocaleString('id-ID'));
            }
        }

        // Donasi tiap 10-20 detik
        setInterval(updateDonation, 10000 + Math.random() * 10000);

        // =============================================
        // 5. ALERT (tengah)
        // =============================================
        let alertTimeout = null;

        function showAlert(emoji, subText) {
            const alertEl = document.getElementById('alert');
            const subEl = document.getElementById('alertSub');
            alertEl.innerHTML = `${emoji} <span class="sub">${subText}</span>`;
            alertEl.classList.add('show');

            clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3000);
        }

        // Tampilkan alert awal
        setTimeout(() => {
            showAlert('🎮', 'THOM Live!');
        }, 1000);

        // =============================================
        // 6. SIMULASI ALERT LAIN (gift, follow, dll)
        // =============================================
        const gifts = ['🎁', '🌹', '🐱', '🚀', '💎', '⭐', '🎊', '❤️'];

        function randomAlert() {
            const gift = gifts[Math.floor(Math.random() * gifts.length)];
            const users = ['Naya', 'Raka', 'Dewi', 'Bima', 'Sari', 'Aldo', 'Maya'];
            const user = users[Math.floor(Math.random() * users.length)];
            showAlert(gift, `${user} mengirim ${gift}!`);
        }

        // Alert gift tiap 15-30 detik
        setInterval(randomAlert, 15000 + Math.random() * 15000);
    </script>
</body>
</html>
