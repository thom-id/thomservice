<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlazeTopia - Shop Roles & Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <div class="header">
            <h1>🔥 <span class="gradient-text">BlazeTopia</span> Store</h1>
            <p>Upgrade your account with exclusive roles & items!</p>
        </div>

        <!-- Player Balance -->
        <div class="balance-card">
            <div class="balance-info">
                <span id="usernameDisplay">👤 Guest</span>
                <span id="playerBalance">💎 0 Gems | 🔒 0 WL</span>
            </div>
            <button class="btn-login" onclick="toggleLogin()">🔑 Login</button>
        </div>

        <!-- Search & Filter -->
        <div class="filter-section">
            <input type="text" 
                   id="searchInput" 
                   placeholder="🔍 Search roles or items..." 
                   oninput="searchItems(this.value)">
            
            <div class="category-tabs">
                <button class="tab active" data-category="all" onclick="filterShop('all', this)">📦 All</button>
                <button class="tab" data-category="role" onclick="filterShop('role', this)">👑 Roles</button>
                <button class="tab" data-category="command" onclick="filterShop('command', this)">⚡ Commands</button>
                <button class="tab" data-category="feature" onclick="filterShop('feature', this)">✨ Features</button>
            </div>
        </div>

        <!-- Shop Grid -->
        <div class="shop-grid" id="shopGrid">
            <!-- Items rendered by JavaScript -->
        </div>

        <!-- Notice -->
        <div class="shop-notice">
            ⚡ All purchases will be processed within 5 minutes.
            <br>For support, contact us on <strong>Discord</strong>.
        </div>

        <!-- Footer -->
        <div class="footer">
            Enter the Flames. Rule the World. 🔥
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
